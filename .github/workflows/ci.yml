name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: pnpm typecheck
      - name: Integration contract smoke test
        run: pnpm test:integration:contract
      - name: Lint
        run: pnpm lint
      - name: Build production
        run: pnpm build
      - name: Upload production artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: umroh-connect-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
